name: Convert Notes to Categorized PDFs

on:
  workflow_dispatch: # 支援在 GitHub 網頁手動點擊執行

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Pandoc and LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex texlive-fonts-recommended texlive-lang-chinese python3

      - name: Create output directory
        run: mkdir -p output_pdfs

      - name: Run Intelligent PDF Packager
        run: |
          python3 - << 'EOF'
          import os
          import subprocess

          # 設定單一 PDF 合併前的文字檔大小上限 (10MB 純文字約可轉成 20-30MB 含圖 PDF)
          MAX_CHUNK_SIZE = 10 * 1024 * 1024  
          OUTPUT_DIR = os.path.abspath("output_pdfs")

          # 取得所有非隱藏的根目錄項目
          items = [f for f in os.listdir('.') if not f.startswith('.') and f != "output_pdfs"]
          
          print(f"Detected items in repo root: {items}")

          for item in sorted(items):
              # 如果是資料夾或單一 md 檔
              md_files = []
              if os.path.isdir(item):
                  target_name = item
                  for root, _, files in os.walk(item):
                      for file in sorted(files):
                          if file.endswith('.md'):
                              md_files.append(os.path.join(root, file))
              elif os.path.isfile(item) and item.endswith('.md'):
                  target_name = "Root_Notes"
                  md_files.append(item)
              else:
                  continue

              md_files.sort()
              if not md_files:
                  print(f"Skipping {item}: No .md files found.")
                  continue

              print(f"\n=== Processing group: {target_name} ({len(md_files)} md files) ===")

              # 分塊邏輯
              chunks = []
              current_chunk = []
              current_size = 0

              for fpath in md_files:
                  try:
                      fsize = os.path.getsize(fpath)
                  except Exception as e:
                      print(f"Could not get size for {fpath}: {e}")
                      continue

                  if current_size + fsize > MAX_CHUNK_SIZE and current_chunk:
                      chunks.append(current_chunk)
                      current_chunk = [fpath]
                      current_size = fsize
                  else:
                      current_chunk.append(fpath)
                      current_size += fsize
              if current_chunk:
                  chunks.append(current_chunk)

              is_multi = len(chunks) > 1

              for idx, chunk_files in enumerate(chunks, start=1):
                  part_suffix = f"_Part{idx}" if is_multi else ""
                  safe_target_name = target_name.replace(" ", "_").replace("/", "_")
                  pdf_filename = f"{safe_target_name}{part_suffix}.pdf"
                  pdf_path = os.path.join(OUTPUT_DIR, pdf_filename)
                  temp_md = f"temp_{safe_target_name}_{idx}.md"

                  print(f"Generating: {pdf_filename} with {len(chunk_files)} files...")

                  # 合併檔案並插入階層資訊 header
                  with open(temp_md, 'w', encoding='utf-8') as outfile:
                      for file_path in chunk_files:
                          outfile.write(f"\n\n<!-- FILE_PATH_HEADER -->\n")
                          outfile.write(f"# [資料夾結構路徑]: {file_path}\n\n")
                          try:
                              with open(file_path, 'r', encoding='utf-8') as infile:
                                  outfile.write(infile.read())
                                  outfile.write("\n\n---\n")
                          except Exception as e:
                              print(f"Error reading {file_path}: {e}")

                  # 執行 Pandoc 轉成 PDF
                  cmd = [
                      "pandoc", temp_md,
                      "-o", pdf_path,
                      "--pdf-engine=xelatex",
                      "-V", "CJKmainfont=Noto Sans CJK SC",
                      "-V", "geometry:margin=1in",
                      "--resource-path=.:images:attachments"
                  ]
                  try:
                      subprocess.run(cmd, check=True)
                      print(f"Successfully created: {pdf_filename}")
                  except subprocess.CalledProcessError as e:
                      print(f"Failed to create {pdf_filename}: {e}")
                  finally:
                      if os.path.exists(temp_md):
                          os.remove(temp_md)

          EOF

      - name: Verify output files
        run: |
          echo "Checking contents of output_pdfs:"
          ls -la output_pdfs/

      - name: Upload PDFs as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Truchas-Notes-PDFs
          path: output_pdfs/*